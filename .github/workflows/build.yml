name: Build 盛夏光年 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Latest ZIP & Auto-Increment Version
        run: |
          LATEST_ZIP=$(ls -1t *.zip | head -n 1)
          echo "Unpacking latest archive: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP"
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/g" app/build.gradle

      - name: Fetch & Pre-Compile 86 Wubi + Pinyin + English Dictionaries
        run: |
          python3 scripts/fetch_full_dict.py
      - name: Fetch Sherpa-ONNX Native Lib & Offline Model
        run: |
          mkdir -p app/libs app/src/main/assets/sherpa_model
          echo "Downloading official sherpa-onnx 2.0.1 AAR..."
          curl -L -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          echo "Downloading streaming zipformer offline model..."
          curl -L -o /tmp/model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23-mobile.tar.bz2
          tar -xjf /tmp/model.tar.bz2 -C /tmp/
          MDIR=$(find /tmp/ -maxdepth 1 -type d -name "*zipformer*" | head -n 1)
          cp "$MDIR/tokens.txt" app/src/main/assets/sherpa_model/
          cp "$MDIR/encoder-epoch-99-avg-1.int8.onnx" app/src/main/assets/sherpa_model/encoder.onnx
          cp "$MDIR/decoder-epoch-99-avg-1.onnx" app/src/main/assets/sherpa_model/decoder.onnx
          cp "$MDIR/joiner-epoch-99-avg-1.int8.onnx" app/src/main/assets/sherpa_model/joiner.onnx
          echo "Sherpa offline voice dependencies successfully assembled!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "盛夏光年_v10.0_build${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShengXiaGuangNian-APK
          path: "盛夏光年_v10.0_build${{ github.run_number }}.apk"
          compression-level: 0

      - name: Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v10.0.${{ github.run_number }}"
          name: "盛夏光年 v10.0 (Build #${{ github.run_number }})"
          body: "自动编译生成的安装包，直接点击下方 Assets 里的 .apk 即可高速下载安装（无需解压 zip）。"
          files: "盛夏光年_v10.0_build${{ github.run_number }}.apk"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
