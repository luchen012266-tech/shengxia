name: Build 盛夏光年 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Latest ZIP & Auto-Increment Version
        run: |
          LATEST_ZIP=$(ls -1 *.zip | sort -V | tail -n 1)
          echo "Unpacking latest archive: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP"
          sed -i '53d' app/src/main/java/com/shengxiaguangnian/ime/EmojiKaomojiData.kt
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/g" app/build.gradle

      - name: Install Permanent Signing Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Fetch Full 86 Wubi Dictionary
        run: |
          python3 scripts/fetch_full_dict.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Publish Direct APK to Repo Root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./盛夏光年_直接下载安装.apk
          gh release create latest ./盛夏光年_直接下载安装.apk --title "盛夏光年最新版 APK" --notes "直接点击下方 .apk 文件即可下载安装，无需解压！" --clobber || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ./盛夏光年_直接下载安装.apk
          git commit -m "Update 盛夏光年_直接下载安装.apk [skip ci]" || true
          git push || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShengXiaGuangNian-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
